<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圖片切片 · HD 的工具箱</title>
  <meta name="description" content="上傳圖片，選欄數與列數，拖曳切線自訂各塊大小，打包成 ZIP 下載，全部在瀏覽器裡完成。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/shared/app.css">
  <script src="/static/shared/theme.js"></script>
  <script src="/static/shared/settings.js"></script>
  <style>
    /* 圖片切片工具專屬樣式（共用元件在 app.css） */
    .slicer-counter { margin-top: var(--space-3); font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); }
    .slicer-counter b { color: var(--accent); font-weight: 500; }
    .slicer-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .slicer-stage[hidden] { display: none; }
    .slicer-figure { position: relative; display: inline-block; line-height: 0; max-width: 100%; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .slicer-figure img, .slicer-figure canvas { display: block; max-width: 100%; max-height: calc(100vh - 200px); }
    .slicer-figure img[hidden], .slicer-figure canvas[hidden] { display: none; }   /* 蓋過 app.css 全域的 img{display:block} */
    /* 去綠幕時露出棋盤格底，看得出哪裡變透明 */
    .slicer-figure--checker {
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #d8d8d8 25%, transparent 25%),
        linear-gradient(-45deg, #d8d8d8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #d8d8d8 75%),
        linear-gradient(-45deg, transparent 75%, #d8d8d8 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
    }
    .slicer-grid { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .slicer-grid .gl-v,
    .slicer-grid .gl-h {
      position: absolute; display: block; padding: 0; border: 0; background: transparent;
      color: var(--accent); opacity: 0.88; pointer-events: auto; touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    .slicer-grid .gl-v { top: 0; bottom: 0; width: 20px; transform: translateX(-50%); cursor: col-resize; }
    .slicer-grid .gl-h { left: 0; right: 0; height: 20px; transform: translateY(-50%); cursor: row-resize; }
    .slicer-grid .gl-v::before,
    .slicer-grid .gl-h::before {
      content: ""; position: absolute; background: var(--accent); opacity: 0.76;
      transition: width 0.12s, height 0.12s, opacity 0.12s;
    }
    .slicer-grid .gl-v::before { top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%); }
    .slicer-grid .gl-h::before { left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-50%); }
    .slicer-grid .gl-v::after,
    .slicer-grid .gl-h::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      border: 1px solid var(--accent); background: var(--surface);
      opacity: 0.9; box-shadow: var(--shadow-sm);
    }
    .slicer-grid .gl-v::after { width: 4px; height: 28px; transform: translate(-50%, -50%); }
    .slicer-grid .gl-h::after { width: 28px; height: 4px; transform: translate(-50%, -50%); }
    .slicer-grid .gl-v:hover::before,
    .slicer-grid .gl-v.is-dragging::before { width: 2px; opacity: 1; }
    .slicer-grid .gl-h:hover::before,
    .slicer-grid .gl-h.is-dragging::before { height: 2px; opacity: 1; }
    .slicer-figure.is-dragging-x { cursor: col-resize; }
    .slicer-figure.is-dragging-y { cursor: row-resize; }
    .slicer-caption { margin-top: var(--space-3); text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
    .slicer-hint { margin-top: var(--space-1); text-align: center; font-size: 12px; color: var(--text-muted); }
    .stepper-pair { display: flex; gap: var(--space-6); flex-wrap: wrap; }
    .hint-line { margin-top: var(--space-2); font-size: 12px; color: var(--text-dim); }
    .hint-line a { color: var(--text-muted); }
    /*
     * 中等寬度仍維持左側控制、右側預覽，只有窄手機才改成上下堆疊。
     * 這頁的預覽是主要工作區，不應因控制項變窄而被推到下方。
     */
    @media (min-width: 521px) and (max-width: 880px) {
      .tool-layout { flex-direction: row; min-height: calc(100vh - 57px); }
      .tool-layout__controls {
        width: 46vw; min-width: 240px; max-width: 280px;
        padding: var(--space-6) var(--space-4);
        border-right: 1px solid var(--border); border-bottom: 0;
        gap: var(--space-4);
      }
      .tool-layout__preview { min-width: 0; padding: var(--space-4); align-items: flex-start; }
      .slicer-stage { height: auto; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-header__row">
      <a href="/" class="brand">HD 的工具箱</a>
      <span class="crumb-sep">/</span>
      <span class="crumb-cur">圖片切片</span>
      <span class="app-header__spacer"></span>
      <a href="/" class="btn btn--ghost" style="padding:6px 10px;font-size:13px">
        <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        回工具箱
      </a>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="切換亮 / 暗模式" title="切換亮 / 暗模式">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main app-main--full">
    <div class="tool-layout">

      <!-- ===== 左：控制 ===== -->
      <div class="tool-layout__controls">

        <div class="section">
          <div class="section__label"><span class="section__num">01</span> 上傳圖片</div>
          <div class="dropzone" id="dropzone">
            <!-- 維持 image/*（原本就吃 SVG / BMP 等），另加 .heic / .heif 副檔名：
                 部分平台對 HEIC 回空 MIME，只靠 image/* 會選不到檔 -->
            <input type="file" id="fileInput" accept="image/*,.heic,.heif" hidden>
            <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><path d="M21 15l-5-5L5 21"/></svg>
            <div class="dropzone__title">拖曳圖片到這裡</div>
            <div class="dropzone__hint">或點擊選擇檔案（PNG / JPG / WEBP / GIF / HEIC）</div>
            <span class="dropzone__file" id="fileName"></span>
          </div>
        </div>

        <div class="section">
          <div class="section__label"><span class="section__num">02</span> 切割設定</div>
          <div class="stepper-pair">
            <div>
              <span class="field-label">欄（水平數）</span>
              <div class="stepper" data-stepper="cols">
                <button type="button" class="stepper__btn" data-delta="-1" aria-label="減少欄數">−</button>
                <span class="stepper__val" id="colsVal">3</span>
                <button type="button" class="stepper__btn" data-delta="1" aria-label="增加欄數">+</button>
              </div>
            </div>
            <div>
              <span class="field-label">列（垂直數）</span>
              <div class="stepper" data-stepper="rows">
                <button type="button" class="stepper__btn" data-delta="-1" aria-label="減少列數">−</button>
                <span class="stepper__val" id="rowsVal">3</span>
                <button type="button" class="stepper__btn" data-delta="1" aria-label="增加列數">+</button>
              </div>
            </div>
          </div>
          <div class="slicer-counter"><b id="cntCols">3</b> 欄 × <b id="cntRows">3</b> 列 = <b id="cntTotal">9</b> 塊</div>
        </div>

        <div class="section">
          <div class="section__label"><span class="section__num">03</span> 背景</div>
          <div class="segmented" id="bgSeg" role="group" aria-label="背景處理">
            <button type="button" class="segmented__btn" data-bg="keep" aria-pressed="true">保留原背景</button>
            <button type="button" class="segmented__btn" data-bg="chroma" aria-pressed="false">去除綠幕</button>
          </div>
          <div class="mt-4 is-disabled-row" id="chromaRow">
            <span class="field-label">綠幕容差（範圍越大去得越多）</span>
            <div class="range-field">
              <input type="range" id="chromaSlider" min="0" max="100" value="40" disabled>
              <span class="range-field__val" id="chromaVal">40</span>
            </div>
            <p class="hint-line">自動偵測四角的背景色。要手動取色或更細的微調，請改用 <a href="/bg-remover">圖片去背</a> 工具。</p>
          </div>
        </div>

        <div class="section">
          <div class="section__label"><span class="section__num">04</span> 輸出格式</div>
          <div class="segmented" id="formatSeg" role="group" aria-label="輸出格式">
            <button type="button" class="segmented__btn" data-format="png" aria-pressed="true">PNG</button>
            <button type="button" class="segmented__btn" data-format="jpg" aria-pressed="false">JPG</button>
            <button type="button" class="segmented__btn" data-format="webp" aria-pressed="false">WEBP</button>
          </div>
          <div class="mt-4 is-disabled-row" id="qualityRow">
            <span class="field-label">品質（JPG / WEBP）</span>
            <div class="range-field">
              <input type="range" id="qualitySlider" min="1" max="100" value="90" disabled>
              <span class="range-field__val" id="qualityVal">90%</span>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section__label"><span class="section__num">05</span> 檔名前綴（可留空）</div>
          <input type="text" class="text-field" id="prefixInput" value="split-" spellcheck="false" autocomplete="off" placeholder="留空 → 檔名為 1-1.png、1-2.png …">
        </div>

        <button type="button" class="btn btn--primary btn--block" id="sliceBtn" disabled>選擇圖片後開始切割</button>

        <div class="progress" id="progress">
          <div class="progress__header">
            <span class="progress__label">處理中</span>
            <span class="progress__status" id="progressStatus"></span>
          </div>
          <div class="progress__track"><div class="progress__bar" id="progressBar"></div></div>
        </div>

        <div class="message message--error" id="errorMsg">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
          <span id="errorText"></span>
        </div>
        <div class="message message--success" id="successMsg">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
          <span id="successText">切割完成，ZIP 已開始下載。</span>
        </div>
      </div>

      <!-- ===== 右：預覽 ===== -->
      <div class="tool-layout__preview" id="previewArea">
        <div class="preview-empty" id="previewEmpty">
          <svg class="preview-empty__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg>
          <p>上傳圖片後預覽將顯示於此</p>
        </div>
        <div class="slicer-stage" id="previewStage" hidden>
          <div>
            <div class="slicer-figure" id="previewFigure">
              <img id="previewImg" alt="預覽">
              <canvas id="previewCanvas" hidden></canvas>
              <div class="slicer-grid" id="previewGrid"></div>
            </div>
            <div class="slicer-caption" id="previewCaption"></div>
            <div class="slicer-hint" id="previewHint">拖曳橙色切線調整每塊大小，按方向鍵可微調</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/static/shared/chroma-key.js"></script>
  <script src="/static/shared/heic-decode.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
  (function () {
    var MIN = 1, MAX = 20, MAX_TILES = 400;
    var FORMAT = {
      png:  { mime: 'image/png',  ext: 'png',  lossy: false },
      jpg:  { mime: 'image/jpeg', ext: 'jpg',  lossy: true  },
      webp: { mime: 'image/webp', ext: 'webp', lossy: true  }
    };

    var $ = function (id) { return document.getElementById(id); };
    var els = {
      dropzone: $('dropzone'), fileInput: $('fileInput'), fileName: $('fileName'),
      colsVal: $('colsVal'), rowsVal: $('rowsVal'),
      cntCols: $('cntCols'), cntRows: $('cntRows'), cntTotal: $('cntTotal'),
      bgSeg: $('bgSeg'), chromaRow: $('chromaRow'), chromaSlider: $('chromaSlider'), chromaVal: $('chromaVal'),
      formatSeg: $('formatSeg'), qualityRow: $('qualityRow'), qualitySlider: $('qualitySlider'), qualityVal: $('qualityVal'),
      prefixInput: $('prefixInput'), sliceBtn: $('sliceBtn'),
      progress: $('progress'), progressBar: $('progressBar'), progressStatus: $('progressStatus'),
      errorMsg: $('errorMsg'), errorText: $('errorText'), successMsg: $('successMsg'), successText: $('successText'),
      previewEmpty: $('previewEmpty'), previewStage: $('previewStage'), previewFigure: $('previewFigure'),
      previewImg: $('previewImg'), previewCanvas: $('previewCanvas'), previewGrid: $('previewGrid'),
      previewCaption: $('previewCaption'), previewHint: $('previewHint')
    };

    // img 可能是 <img>（一般格式）或 <canvas>（HEIC 解碼後），所以尺寸另外存，
    // 不再直接讀 naturalWidth / naturalHeight
    var state = { cols: 3, rows: 3, format: 'png', img: null, imgW: 0, imgH: 0, imgURL: null, busy: false,
                  xCuts: null, yCuts: null, drag: null,
                  chroma: false, chromaTolerance: 40, chromaCanvas: null, chromaDirty: false };
    var loadSeq = 0; // 換檔序號：HEIC 解碼是非同步的，快速連換時只有最後一次能寫入 state

    function clamp(n) { return Math.max(MIN, Math.min(MAX, n)); }
    function showError(msg) { els.errorText.textContent = msg; els.errorMsg.classList.add('is-shown'); els.successMsg.classList.remove('is-shown'); }
    function showSuccess(msg) { els.successText.textContent = msg; els.successMsg.classList.add('is-shown'); els.errorMsg.classList.remove('is-shown'); }
    function hideMessages() { els.errorMsg.classList.remove('is-shown'); els.successMsg.classList.remove('is-shown'); }
    function sanitizePrefix(p) { return (p || '').trim().replace(/[\\\/:*?"<>|]+/g, '_'); }

    // n 等分 total，回傳 n+1 個切點（含 0 與 total）；最後一段吃餘數，避免邊緣掉像素
    function tileEdges(total, n) {
      var base = Math.floor(total / n), edges = [0], acc = 0;
      for (var i = 0; i < n; i++) { acc += (i === n - 1) ? (total - acc) : base; edges.push(acc); }
      return edges;
    }
    // 調整欄 / 列數時盡量保留使用者已拖曳的切線：
    // 增加時從最寬的區塊中間插入，減少時合併最窄的相鄰區塊。
    function adjustCuts(cuts, total, count) {
      if (!cuts || cuts.length < 2) return tileEdges(total, count);
      var next = cuts.slice().map(function (n) { return Math.max(0, Math.min(total, Math.round(n))); });
      next[0] = 0; next[next.length - 1] = total;
      while (next.length - 1 < count) {
        var widestIndex = 0, widest = -1;
        for (var i = 0; i < next.length - 1; i++) {
          var width = next[i + 1] - next[i];
          if (width > widest) { widest = width; widestIndex = i; }
        }
        if (widest <= 0) return tileEdges(total, count);
        next.splice(widestIndex + 1, 0, Math.floor((next[widestIndex] + next[widestIndex + 1]) / 2));
      }
      while (next.length - 1 > count) {
        var removeIndex = 1, smallest = Infinity;
        for (var j = 1; j < next.length - 1; j++) {
          var merged = next[j + 1] - next[j - 1];
          if (merged < smallest) { smallest = merged; removeIndex = j; }
        }
        next.splice(removeIndex, 1);
      }
      return next;
    }

    function cutsFor(axis) { return axis === 'x' ? state.xCuts : state.yCuts; }
    function totalFor(axis) { return axis === 'x' ? state.imgW : state.imgH; }
    function countFor(axis) { return axis === 'x' ? state.cols : state.rows; }
    function minCutGap(axis) { return totalFor(axis) >= countFor(axis) ? 1 : 0; }

    function clampCut(axis, index, value) {
      var cuts = cutsFor(axis), gap = minCutGap(axis);
      var min = cuts[index - 1] + gap, max = cuts[index + 1] - gap;
      return Math.max(min, Math.min(max, Math.round(value)));
    }

    function guideLabel(axis, index) {
      return axis === 'x'
        ? '第 ' + index + ' 條垂直切線，距左側 ' + cutsFor(axis)[index] + ' px'
        : '第 ' + index + ' 條水平切線，距上方 ' + cutsFor(axis)[index] + ' px';
    }

    function updateGuideHandle(axis, index) {
      var handle = els.previewGrid.querySelector('[data-axis="' + axis + '"][data-index="' + index + '"]');
      if (!handle) return;
      var cuts = cutsFor(axis), total = totalFor(axis), value = cuts[index];
      if (axis === 'x') handle.style.left = (value / total * 100) + '%';
      else handle.style.top = (value / total * 100) + '%';
      handle.setAttribute('aria-label', '拖曳調整' + guideLabel(axis, index));
      handle.setAttribute('aria-valuemin', String(cuts[index - 1] + minCutGap(axis)));
      handle.setAttribute('aria-valuemax', String(cuts[index + 1] - minCutGap(axis)));
      handle.setAttribute('aria-valuenow', String(value));
      handle.setAttribute('aria-valuetext', guideLabel(axis, index));
    }

    function syncCounter() {
      var c = state.cols, r = state.rows;
      els.colsVal.textContent = c; els.rowsVal.textContent = r;
      els.cntCols.textContent = c; els.cntRows.textContent = r; els.cntTotal.textContent = c * r;
      document.querySelectorAll('.stepper').forEach(function (st) {

        var key = st.getAttribute('data-stepper'), v = state[key];
        st.querySelector('[data-delta="-1"]').disabled = (v <= MIN) || state.busy;
        st.querySelector('[data-delta="1"]').disabled = (v >= MAX) || state.busy;
      });
    }

    function syncQualityRow() {
      var lossy = FORMAT[state.format].lossy;
      els.qualitySlider.disabled = !lossy || state.busy;
      els.qualityRow.classList.toggle('is-disabled-row', !lossy);
    }

    // 去綠幕需要 alpha → 鎖成 PNG / WEBP，停用 JPG
    function syncFormatAvailability() {
      var jpgBtn = els.formatSeg.querySelector('[data-format="jpg"]');
      var lockPng = state.chroma;
      jpgBtn.disabled = lockPng || state.busy;
      jpgBtn.style.opacity = lockPng ? '0.4' : '';
      jpgBtn.title = lockPng ? '去除綠幕時需要透明背景，不支援 JPG' : '';
      if (lockPng && state.format === 'jpg') {
        state.format = 'png';
        els.formatSeg.querySelectorAll('.segmented__btn').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-format') === 'png' ? 'true' : 'false'); });
        syncQualityRow();
      }
    }

    function syncChromaRow() {
      els.chromaRow.classList.toggle('is-disabled-row', !state.chroma);
      els.chromaSlider.disabled = !state.chroma || state.busy;
    }

    function markChromaDirty() { state.chromaDirty = true; }

    // 對整張原圖去綠幕，結果存進 state.chromaCanvas（之後切片以它為來源）
    function runChroma() {
      if (!state.img) return;
      var out = ChromaKey.process(state.img, { tolerance: state.chromaTolerance / 100 });
      state.chromaCanvas = out.canvas;
      state.chromaDirty = false;
      var c = els.previewCanvas;
      c.width = out.canvas.width; c.height = out.canvas.height;
      c.getContext('2d').drawImage(out.canvas, 0, 0);
    }
    function ensureChroma() { if (state.chroma && (state.chromaDirty || !state.chromaCanvas)) runChroma(); }

    // HEIC 來源是 canvas，沒有能塞進 <img> 的 URL，一律走 previewCanvas
    function isCanvasSource() { return !!state.img && state.img.tagName === 'CANVAS'; }

    function refreshPreviewImage() {
      if (!state.img) return;
      var useCanvas = state.chroma || isCanvasSource();
      if (state.chroma) {
        ensureChroma();
      } else if (useCanvas) {
        // 去綠幕開了又關時，previewCanvas 裡是去綠幕後的畫面，要重畫回原圖
        var c = els.previewCanvas;
        c.width = state.imgW; c.height = state.imgH;
        c.getContext('2d').drawImage(state.img, 0, 0);
      }
      els.previewImg.hidden = useCanvas;
      els.previewCanvas.hidden = !useCanvas;
      els.previewFigure.classList.toggle('slicer-figure--checker', state.chroma);
    }

    function sliceSource() { return (state.chroma && state.chromaCanvas) ? state.chromaCanvas : state.img; }

    function syncSliceBtn() {
      els.sliceBtn.disabled = !state.img || state.busy;
      if (!state.img) els.sliceBtn.textContent = '選擇圖片後開始切割';
      else if (state.busy) els.sliceBtn.textContent = '處理中…';
      else els.sliceBtn.textContent = '開始切割（' + (state.cols * state.rows) + ' 塊）';
    }

    function renderGridOverlay() {
      els.previewGrid.replaceChildren();
      if (!state.img) return;
      var W = state.imgW, H = state.imgH, i;
      if (!state.xCuts || state.xCuts.length !== state.cols + 1) state.xCuts = tileEdges(W, state.cols);
      if (!state.yCuts || state.yCuts.length !== state.rows + 1) state.yCuts = tileEdges(H, state.rows);

      for (i = 1; i < state.xCuts.length - 1; i++) {
        var v = document.createElement('button');
        v.type = 'button'; v.className = 'gl-v'; v.dataset.axis = 'x'; v.dataset.index = i;
        v.setAttribute('role', 'slider'); v.setAttribute('aria-orientation', 'vertical');
        v.addEventListener('pointerdown', startGuideDrag);
        v.addEventListener('keydown', handleGuideKeydown);
        els.previewGrid.appendChild(v);
        updateGuideHandle('x', i);
      }
      for (i = 1; i < state.yCuts.length - 1; i++) {
        var h = document.createElement('button');
        h.type = 'button'; h.className = 'gl-h'; h.dataset.axis = 'y'; h.dataset.index = i;
        h.setAttribute('role', 'slider'); h.setAttribute('aria-orientation', 'horizontal');
        h.addEventListener('pointerdown', startGuideDrag);
        h.addEventListener('keydown', handleGuideKeydown);
        els.previewGrid.appendChild(h);
        updateGuideHandle('y', i);
      }
    }

    function updateCaption() {
      if (!state.img) return;
      var W = state.imgW, H = state.imgH;
      els.previewCaption.textContent = (state.chroma ? '已去綠幕 ｜ ' : '') + '原圖 ' + W + ' × ' + H +
        ' ｜ ' + state.cols + ' 欄 × ' + state.rows + ' 列';
    }

    function updateGuideFromPointer(e) {
      if (!state.drag || !state.img) return;
      var axis = state.drag.axis, rect = els.previewFigure.getBoundingClientRect();
      var span = axis === 'x' ? rect.width : rect.height;
      var offset = axis === 'x' ? e.clientX - rect.left : e.clientY - rect.top;
      if (!span) return;
      var value = offset / span * totalFor(axis);
      cutsFor(axis)[state.drag.index] = clampCut(axis, state.drag.index, value);
      updateGuideHandle(axis, state.drag.index);
      updateCaption();
    }

    function stopGuideDrag(e) {
      if (!state.drag || (e && e.pointerId !== state.drag.pointerId)) return;
      var drag = state.drag;
      if (drag.handle && drag.handle.hasPointerCapture && drag.handle.hasPointerCapture(drag.pointerId)) {
        drag.handle.releasePointerCapture(drag.pointerId);
      }
      drag.handle.classList.remove('is-dragging');
      els.previewFigure.classList.remove('is-dragging-x', 'is-dragging-y');
      document.removeEventListener('pointermove', updateGuideFromPointer);
      document.removeEventListener('pointerup', stopGuideDrag);
      document.removeEventListener('pointercancel', stopGuideDrag);
      state.drag = null;
    }

    function startGuideDrag(e) {
      if (state.busy || !state.img || (e.button !== undefined && e.button !== 0)) return;
      e.preventDefault();
      var handle = e.currentTarget;
      state.drag = {
        axis: handle.dataset.axis,
        index: parseInt(handle.dataset.index, 10),
        pointerId: e.pointerId,
        handle: handle
      };
      handle.classList.add('is-dragging');
      els.previewFigure.classList.add('is-dragging-' + state.drag.axis);
      if (handle.setPointerCapture) handle.setPointerCapture(e.pointerId);
      document.addEventListener('pointermove', updateGuideFromPointer);
      document.addEventListener('pointerup', stopGuideDrag);
      document.addEventListener('pointercancel', stopGuideDrag);
    }

    function handleGuideKeydown(e) {
      if (state.busy || !state.img) return;
      var axis = e.currentTarget.dataset.axis, index = parseInt(e.currentTarget.dataset.index, 10);
      var key = e.key, direction = 0;
      if ((axis === 'x' && key === 'ArrowLeft') || (axis === 'y' && key === 'ArrowUp')) direction = -1;
      if ((axis === 'x' && key === 'ArrowRight') || (axis === 'y' && key === 'ArrowDown')) direction = 1;
      var cuts = cutsFor(axis);
      if (key === 'Home') cuts[index] = cuts[index - 1] + minCutGap(axis);
      else if (key === 'End') cuts[index] = cuts[index + 1] - minCutGap(axis);
      else if (direction) cuts[index] = clampCut(axis, index, cuts[index] + direction * (e.shiftKey ? 10 : 1));
      else return;
      e.preventDefault();
      updateGuideHandle(axis, index);
      updateCaption();
    }

    function refreshPreview() {
      if (state.img) { refreshPreviewImage(); renderGridOverlay(); updateCaption(); }
      syncCounter(); syncSliceBtn();
    }

    // node 是 <img> 或 <canvas>；url 只有 <img> 那條路徑有（HEIC 沒有可直接顯示的 URL）
    function applyLoaded(file, node, w, h, url) {
      if (state.imgURL) { URL.revokeObjectURL(state.imgURL); state.imgURL = null; }
      state.img = node; state.imgW = w; state.imgH = h; state.imgURL = url || null;
      state.xCuts = tileEdges(w, state.cols); state.yCuts = tileEdges(h, state.rows); state.drag = null;
      state.chromaCanvas = null; state.chromaDirty = true;
      els.fileName.textContent = file.name + '  ·  ' + w + '×' + h;
      els.fileName.classList.add('is-shown');
      if (url) els.previewImg.src = url;
      els.previewEmpty.hidden = true; els.previewStage.hidden = false;
      refreshPreview();
    }

    function loadFile(file) {
      hideMessages();
      if (!file) return;
      var seq = ++loadSeq; // 之後每個非同步回呼都要確認自己還是最新那次選擇
      return HeicDecode.isHeic(file).then(function (heic) {
        if (seq !== loadSeq) return;
        return heic ? loadHeic(file, seq) : loadBitmap(file, seq);
      });
    }

    function loadHeic(file, seq) {
      // 失敗時要把標籤還原成前一張的狀態，否則畫面上留著舊圖卻沒有檔名
      var prevLabel = els.fileName.textContent;
      var prevShown = els.fileName.classList.contains('is-shown');
      els.fileName.textContent = '正在載入 HEIC 解碼器…';
      els.fileName.classList.add('is-shown');
      return file.arrayBuffer().then(function (buf) {
        return HeicDecode.decodeToCanvas(buf);
      }).then(function (canvas) {
        if (seq !== loadSeq) return; // 使用者已經換了別張，這次結果丟掉
        applyLoaded(file, canvas, canvas.width, canvas.height, null);
      }).catch(function (e) {
        if (seq !== loadSeq) return;
        els.fileName.textContent = prevLabel;
        els.fileName.classList.toggle('is-shown', prevShown);
        showError(e && e.message ? e.message : 'HEIC 解碼失敗。');
      });
    }

    function loadBitmap(file, seq) {
      if (!file.type || file.type.indexOf('image/') !== 0) {
        showError('請選擇圖片檔（PNG / JPG / WEBP / GIF / HEIC）。'); return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        if (seq !== loadSeq) { URL.revokeObjectURL(url); return; }
        if (!img.naturalWidth || !img.naturalHeight) { URL.revokeObjectURL(url); showError('無法讀取這張圖片的尺寸。'); return; }
        applyLoaded(file, img, img.naturalWidth, img.naturalHeight, url);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        if (seq !== loadSeq) return;
        showError('這個檔案無法當作圖片載入。');
      };
      img.src = url;
    }

    function canvasToBlob(canvas, mime, quality) {
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error('產生圖片失敗（' + mime + '）')); }, mime, quality);
      });
    }

    async function doSlice() {
      if (!state.img || state.busy) return;
      var cols = state.cols, rows = state.rows, total = cols * rows;
      if (total > MAX_TILES) { showError('一次最多 ' + MAX_TILES + ' 塊，目前 ' + total + ' 塊太多了。'); return; }
      if (typeof JSZip === 'undefined') { showError('打包元件（JSZip）載入失敗，請檢查網路連線後重新整理頁面。'); return; }

      ensureChroma();
      var src = sliceSource();
      var fmt = FORMAT[state.format];
      var quality = fmt.lossy ? (parseInt(els.qualitySlider.value, 10) / 100) : undefined;
      var prefix = sanitizePrefix(els.prefixInput.value); // 可為空字串
      var W = state.imgW, H = state.imgH;
      var xs = state.xCuts, ys = state.yCuts;

      state.busy = true; hideMessages();
      syncSliceBtn(); syncCounter(); syncQualityRow(); syncFormatAvailability(); syncChromaRow();
      els.progress.classList.add('is-shown');
      els.progressBar.style.width = '0%';
      els.progressStatus.textContent = '切割中… 0 / ' + total;

      try {
        var zip = new JSZip(), done = 0;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            var sx = xs[c], sy = ys[r], sw = xs[c + 1] - sx, sh = ys[r + 1] - sy;
            var canvas = document.createElement('canvas');
            canvas.width = sw; canvas.height = sh;
            canvas.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
            var blob = await canvasToBlob(canvas, fmt.mime, quality);
            // 命名：[前綴]列-欄（預設前綴 split- → split-1-1.png；前綴留空 → 1-1.png；依列再依欄）
            var stem = (r + 1) + '-' + (c + 1);
            zip.file(prefix + stem + '.' + fmt.ext, blob);
            done++;
            els.progressBar.style.width = Math.round(done / total * 80) + '%';
            els.progressStatus.textContent = '切割中… ' + done + ' / ' + total;
            if (done % 8 === 0) await new Promise(function (res) { setTimeout(res, 0); });
          }
        }
        els.progressStatus.textContent = '打包中…';
        var content = await zip.generateAsync(
          { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
          function (meta) { els.progressBar.style.width = (80 + Math.round(meta.percent * 0.18)) + '%'; }
        );
        els.progressBar.style.width = '100%';
        els.progressStatus.textContent = '完成';

        var dlURL = URL.createObjectURL(content);
        var a = document.createElement('a');
        a.href = dlURL; a.download = prefix + 'slices.zip';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(dlURL);

        setTimeout(function () { els.progress.classList.remove('is-shown'); }, 500);
        showSuccess('已切成 ' + total + ' 塊（' + fmt.ext.toUpperCase() + (state.chroma ? '、已去綠幕' : '') + '），ZIP 已開始下載。');
      } catch (e) {
        els.progress.classList.remove('is-shown');
        showError(e && e.message ? e.message : '切割失敗。');
      } finally {
        state.busy = false;
        syncSliceBtn(); syncCounter(); syncQualityRow(); syncFormatAvailability(); syncChromaRow();
      }
    }

    // ---- events ----
    els.dropzone.addEventListener('click', function () { els.fileInput.click(); });
    els.dropzone.addEventListener('dragover', function (e) { e.preventDefault(); els.dropzone.classList.add('is-dragover'); });
    els.dropzone.addEventListener('dragleave', function (e) { e.preventDefault(); els.dropzone.classList.remove('is-dragover'); });
    els.dropzone.addEventListener('drop', function (e) {
      e.preventDefault(); els.dropzone.classList.remove('is-dragover');
      if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
    });
    els.fileInput.addEventListener('change', function (e) { if (e.target.files.length) loadFile(e.target.files[0]); });

    document.querySelectorAll('.stepper').forEach(function (st) {
      var key = st.getAttribute('data-stepper');
      st.querySelectorAll('.stepper__btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (state.busy) return;
          var previous = state[key];
          state[key] = clamp(state[key] + parseInt(btn.getAttribute('data-delta'), 10));
          if (state.img && state[key] !== previous) {
            if (key === 'cols') state.xCuts = adjustCuts(state.xCuts, state.imgW, state.cols);
            else state.yCuts = adjustCuts(state.yCuts, state.imgH, state.rows);
          }
          refreshPreview();
        });
      });
    });

    els.formatSeg.querySelectorAll('.segmented__btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (state.busy || btn.disabled) return;
        state.format = btn.getAttribute('data-format');
        els.formatSeg.querySelectorAll('.segmented__btn').forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
        syncQualityRow();
      });
    });

    els.bgSeg.querySelectorAll('.segmented__btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (state.busy) return;
        state.chroma = btn.getAttribute('data-bg') === 'chroma';
        els.bgSeg.querySelectorAll('.segmented__btn').forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
        markChromaDirty();
        syncChromaRow(); syncFormatAvailability();
        refreshPreview();
      });
    });

    var chromaDebounce = null;
    els.chromaSlider.addEventListener('input', function () {
      state.chromaTolerance = parseInt(els.chromaSlider.value, 10);
      els.chromaVal.textContent = state.chromaTolerance;
      markChromaDirty();
      if (chromaDebounce) clearTimeout(chromaDebounce);
      chromaDebounce = setTimeout(function () {
        chromaDebounce = null;
        if (state.img && state.chroma) { runChroma(); refreshPreviewImage(); updateCaption(); }
      }, 140);
    });

    els.qualitySlider.addEventListener('input', function () { els.qualityVal.textContent = els.qualitySlider.value + '%'; });
    els.sliceBtn.addEventListener('click', doSlice);

    // ---- init ----
    syncCounter(); syncQualityRow(); syncChromaRow(); syncFormatAvailability(); syncSliceBtn();
  })();
  </script>
</body>
</html>
